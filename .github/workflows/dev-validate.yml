# =============================================================================
# Data360 Front — Dev validation gate (GitHub Actions)
#
# Vercel is connected to GitHub and auto-deploys the `dev` branch as a preview.
# This workflow does NOT deploy (that would double-deploy). Its job is to
# VALIDATE every push to `dev` so you have a green signal before opening the MR.
#
# Gate policy (verified locally 2026-05-29 — all three pass at 0 errors):
#   - build    : BLOCKING — mirrors exactly what Vercel ships.
#   - lint     : BLOCKING — clean (0 errors).
#   - typecheck: BLOCKING — clean (0 errors). Note the app builds with
#     next.config.mjs `typescript.ignoreBuildErrors: true`, so tsc would NOT
#     fail a Vercel deploy on its own; this gate is what keeps type errors out.
#
# No secrets required: build runs with SKIP_ENV_VALIDATION (runtime env vars
# live on the Vercel project, not here).
# =============================================================================

name: dev-validate

on:
  push:
    branches: [dev]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/dev-validate.yml"
  # Gate PRs into dev/prod BEFORE merge — closes the gap where a broken build
  # could only be caught post-merge on the dev push (e.g. the api-contracts
  # JSDoc syntax error that reached the dev preview in PR #2).
  pull_request:
    branches: [dev, prod]
    paths:
      - "apps/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/dev-validate.yml"
  workflow_dispatch: {}

# Cancel superseded runs on the same branch — only the latest dev push matters.
concurrency:
  group: dev-validate-${{ github.ref }}
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "true"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "ci-only-not-used-at-runtime-32chars-minimum-padding"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter iso build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/data360
        run: npx tsc --noEmit --pretty false --ignoreDeprecations 5.0

      # Route-manifest gate — REPORT-ONLY for now (continue-on-error). Detects
      # FE↔BE path drift: every frontend API path must match a live backend route
      # in backend-route-manifest.json. ~142 unresolved today (genuine drift +
      # some ${CONST}-base-path scanner false-positives). Surfaces the list in CI
      # without blocking; flip to blocking (remove continue-on-error) once drift
      # is driven to 0 — see scripts/check-route-manifest.mjs + Backlog V2 §C1.
      - name: Check API routes (FE↔BE drift) — report-only
        continue-on-error: true
        working-directory: apps/data360
        run: pnpm check:routes

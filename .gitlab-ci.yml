# =============================================================================
# Data360 Front — GitLab CI (minimal)
#
# Fast path on every push: build → (deploy on main).
# Quality jobs (lint, typecheck) run in parallel WITH build (non-blocking).
# Heavy stuff (a11y, playwright, dep-audit, secret-scan, prettier, bundle,
# unit-test) runs only on `schedule` pipelines or when `RUN_EXTRAS=1`.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   - VERCEL_TOKEN        : masked + protected (from vercel.com/account/tokens)
#   - NEXTAUTH_SECRET     : masked + protected (32+ char random string)
#   - NEXT_PUBLIC_API_URL : `https://api.datalab360.io` (or your prod URL)
# Optional:
#   - SF_ACCOUNT, SF_USER, SF_PASSWORD, SF_WAREHOUSE, SF_DATABASE, SF_SCHEMA,
#     SF_ROLE  → only needed if the runtime needs them at build time (it does
#     not today; the front talks to backend via NEXT_PUBLIC_API_URL).
# =============================================================================

stages:
  - build
  - deploy
  - extras

variables:
  VERCEL_ORG_ID: "team_kC7CPyVYhZTxlOrqAlaKbKfi"
  VERCEL_PROJECT_ID: "prj_P5hsPsdZ24jZUqJzaULd0hFYkKkL"
  SKIP_ENV_VALIDATION: "true"
  NEXTAUTH_URL: "http://localhost:3000"          # CI build doesn't need a real URL
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  PNPM_VERSION: "9.1.4"
  # Default secret value for CI build — overridden by GitLab if NEXTAUTH_SECRET
  # is set in CI/CD Variables (recommended for production builds).
  NEXTAUTH_SECRET: "ci-only-not-used-at-runtime-32chars-minimum-padding"

default:
  image: node:20-alpine
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure, stuck_or_timeout_failure]

# Single shared cache, keyed by lockfile hash (warm across branches & MRs).
.with-pnpm:
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: pnpm-v2
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/data360/node_modules/
      - apps/data360/.next/cache/
      - packages/config-tailwind/node_modules/
      - packages/config-typescript/node_modules/
      - packages/data360-core/node_modules/
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
    - mkdir -p reports

# ============================================================================
# BUILD — gates deploy. Lint + typecheck run in parallel, non-blocking.
# ============================================================================

build:
  stage: build
  extends: .with-pnpm
  timeout: 12 minutes
  script:
    - pnpm --filter iso build 2>&1 | tee reports/build.txt
  artifacts:
    when: always
    paths: [reports/build.txt]
    expire_in: 3 days

lint:
  stage: build
  extends: .with-pnpm
  timeout: 6 minutes
  script:
    - set +e
    - pnpm lint 2>&1 | tee reports/eslint.txt
    - LINT_EXIT=${PIPESTATUS[0]}
    - 'echo "Lint exit=$LINT_EXIT"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LINT_EXIT" != "0" ]; then exit $LINT_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/eslint.txt]
    expire_in: 1 week
  allow_failure: true

typecheck:
  stage: build
  extends: .with-pnpm
  timeout: 6 minutes
  script:
    - set +e
    - cd apps/data360
    - npx tsc --noEmit --pretty false --ignoreDeprecations 5.0 2>&1 | tee ../../reports/tsc.txt
    - TSC_EXIT=${PIPESTATUS[0]}
    - ERR=$(grep -cE 'error TS[0-9]+' ../../reports/tsc.txt || echo 0)
    - 'echo "TypeScript errors=$ERR"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$TSC_EXIT" != "0" ]; then exit $TSC_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/tsc.txt]
    expire_in: 1 week
  allow_failure: true

# ============================================================================
# DEPLOY — main branch only. Vercel rebuilds from source so we don't pull
# the build artifact (saves ~30s + bandwidth).
# ============================================================================

deploy:
  stage: deploy
  image: node:20-alpine
  timeout: 10 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs: ["build"]
  dependencies: []
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "$VERCEL_TOKEN" ]; then
        echo "FAIL: VERCEL_TOKEN missing in CI/CD variables (Settings → CI/CD → Variables, masked, protected)"
        exit 1
      fi
    - npm install --prefix /tmp/vercel-bin --silent --no-save vercel@latest
    - export PATH="/tmp/vercel-bin/node_modules/.bin:$PATH"
    # The linked Vercel project has rootDirectory=apps/data360. .vercel/ is
    # gitignored so we synthesise project.json at WORKSPACE ROOT — the dir we
    # run vercel from. rootDirectory is relative to that root.
    - mkdir -p .vercel
    - |
      cat > .vercel/project.json <<EOF
      {
        "projectId": "$VERCEL_PROJECT_ID",
        "orgId": "$VERCEL_ORG_ID",
        "settings": {
          "framework": "nextjs",
          "rootDirectory": "apps/data360"
        }
      }
      EOF
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
    - tail -n 1 deploy.log > vercel-deploy-url.txt
    - 'echo "Deployed -> $(cat vercel-deploy-url.txt)"'
  artifacts:
    paths: [vercel-deploy-url.txt, deploy.log]
    expire_in: 30 days

# ============================================================================
# EXTRAS — opt-in heavy quality lane. Trigger via:
#   - schedule pipelines (GitLab → CI/CD → Schedules)
#   - main branch (auto)
#   - any pipeline with RUN_EXTRAS=1 set as a variable
# ============================================================================

.extras-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$RUN_EXTRAS == "1"'

extras:format-check:
  stage: extras
  extends: .with-pnpm
  rules: !reference [.extras-rules, rules]
  timeout: 8 minutes
  script:
    - set +e
    - cd apps/data360
    - npx prettier --check 'src/**/*.{ts,tsx,js,jsx,json,md}' 2>&1 | tee ../../reports/prettier.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/prettier.txt]
    expire_in: 1 week
  allow_failure: true

extras:dep-audit:
  stage: extras
  extends: .with-pnpm
  rules: !reference [.extras-rules, rules]
  timeout: 8 minutes
  script:
    - set +e
    - pnpm audit --prod 2>&1 | tee reports/pnpm-audit.txt || true
    - exit 0
  artifacts:
    when: always
    paths: [reports/pnpm-audit.txt]
    expire_in: 1 week
  allow_failure: true

extras:secret-scan:
  stage: extras
  image: debian:bookworm-slim
  rules: !reference [.extras-rules, rules]
  timeout: 5 minutes
  needs: []
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq grep findutils > /dev/null
    - mkdir -p reports
  script:
    - set +e
    - find apps packages -type d \( -name node_modules -o -name .next -o -name .pnpm-store -o -name .turbo -o -name dist -o -name build \) -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.json' \) -print > /tmp/scan-files.txt 2>/dev/null || true
    - xargs -a /tmp/scan-files.txt grep -EHn '(SECRET|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["\x27][^"\x27]{8,}' 2>/dev/null | tee reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'eyJhbGciOi[A-Za-z0-9_-]{20,}' 2>/dev/null | tee -a reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'http://api\.datalab360\.io' 2>/dev/null | tee -a reports/secrets.txt || true
    - LEAKS=$(grep -c . reports/secrets.txt 2>/dev/null || echo 0)
    - 'echo "Potential leaks=$LEAKS"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LEAKS" -gt 0 ]; then exit 1; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/secrets.txt]
    expire_in: 1 month
  allow_failure: true

extras:dead-route-scan:
  stage: extras
  extends: .with-pnpm
  rules: !reference [.extras-rules, rules]
  timeout: 5 minutes
  script:
    - set +e
    - node scripts/ci/scan-dead-routes.mjs > reports/dead-routes.txt 2>&1 || true
    - cat reports/dead-routes.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/dead-routes.txt]
    expire_in: 1 week
  allow_failure: true

extras:bundle-size:
  stage: extras
  extends: .with-pnpm
  rules: !reference [.extras-rules, rules]
  timeout: 6 minutes
  needs:
    - job: build
      artifacts: false
  script:
    - set +e
    - pnpm --filter iso build > /dev/null 2>&1
    - node scripts/ci/bundle-report.mjs apps/data360/.next > reports/bundle.txt 2>&1 || true
    - cat reports/bundle.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/bundle.txt]
    expire_in: 1 week
  allow_failure: true

# =============================================================================
# Data360 Front — GitLab CI (light + fast)
#
# Fast path on every push: install → (lint ‖ typecheck) → build → deploy.
# Heavy quality/analyze jobs (a11y, playwright, bundle, audit, secret-scan,
# dead-routes, prettier) run nightly on scheduled pipelines OR on demand via
# the manual `extras:*` jobs — they no longer gate every push.
#
# Set ENFORCE_QUALITY=1 in CI variables to convert allow_failure quality jobs
# to hard. Set RUN_EXTRAS=1 on any pipeline to also run the heavy lane.
# =============================================================================

stages:
  - quality
  - build
  - deploy
  - extras

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  VERCEL_ORG_ID: "team_kC7CPyVYhZTxlOrqAlaKbKfi"
  VERCEL_PROJECT_ID: "prj_P5hsPsdZ24jZUqJzaULd0hFYkKkL"
  SKIP_ENV_VALIDATION: "true"
  NEXTAUTH_SECRET: "ci-only-not-used-at-runtime-32chars-minimum"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  ENFORCE_QUALITY: "0"
  RUN_EXTRAS: "0"
  # GitLab pulls a smaller image and caches it across jobs.
  PNPM_VERSION: "9.1.4"

default:
  image: node:20-alpine
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, scheduler_failure, stuck_or_timeout_failure]

# Shared cache keyed by lockfile (stable across branches/MRs → cold-start MRs hit cache).
.cache:
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: pnpm-v1
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/data360/node_modules/
      - apps/data360/.next/cache/
      - packages/config-tailwind/node_modules/
      - packages/config-typescript/node_modules/
      - packages/data360-core/node_modules/
    policy: pull-push

# corepack activates pnpm without a separate npm install — ~30s/job saved.
.node-setup:
  extends: .cache
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
    - mkdir -p reports

# Quality jobs read cache only — they don't pollute it with their own state.
.node-readonly:
  extends: .node-setup
  cache:
    key:
      files: [pnpm-lock.yaml]
      prefix: pnpm-v1
    paths:
      - .pnpm-store/
      - node_modules/
      - apps/data360/node_modules/
      - packages/config-tailwind/node_modules/
      - packages/config-typescript/node_modules/
      - packages/data360-core/node_modules/
    policy: pull

# ============================================================================
# QUALITY (parallel, allow_failure) — does not gate deploy
# ============================================================================

lint:
  stage: quality
  extends: .node-readonly
  timeout: 8 minutes
  script:
    - set +e
    - pnpm lint 2>&1 | tee reports/eslint.txt
    - LINT_EXIT=${PIPESTATUS[0]}
    - 'echo "Lint exit=$LINT_EXIT"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LINT_EXIT" != "0" ]; then exit $LINT_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/eslint.txt]
    expire_in: 1 week
  allow_failure: true

typecheck:
  stage: quality
  extends: .node-readonly
  timeout: 8 minutes
  script:
    - set +e
    - cd apps/data360
    - npx tsc --noEmit --pretty false --ignoreDeprecations 5.0 2>&1 | tee ../../reports/tsc.txt
    - TSC_EXIT=${PIPESTATUS[0]}
    - ERR=$(grep -cE 'error TS[0-9]+' ../../reports/tsc.txt || echo 0)
    - 'echo "TypeScript errors=$ERR"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$TSC_EXIT" != "0" ]; then exit $TSC_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/tsc.txt]
    expire_in: 1 week
  allow_failure: true

# ============================================================================
# BUILD — gates deploy
# ============================================================================

build:
  stage: build
  extends: .node-setup
  timeout: 12 minutes
  needs: []  # don't wait on quality
  script:
    - pnpm --filter iso build 2>&1 | tee reports/build.txt
  artifacts:
    when: always
    paths:
      - apps/data360/.next/
      - reports/build.txt
    expire_in: 1 day

# ============================================================================
# DEPLOY — main branch only, depends on build artifacts
# ============================================================================

deploy:
  stage: deploy
  image: node:20-alpine
  timeout: 10 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  # build gates deploy (stage ordering) but we don't pull its .next artifact —
  # `vercel build` produces .vercel/output/ from source and the artifact would
  # be ~50 MB of dead weight transferred over the network.
  needs: ["build"]
  dependencies: []
  before_script:
    - apk add --no-cache git
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
  script:
    - |
      if [ -z "$VERCEL_TOKEN" ]; then
        echo "FAIL: VERCEL_TOKEN missing in CI/CD variables (Settings → CI/CD → Variables, masked, protected)"
        exit 1
      fi
    - npm install --prefix /tmp/vercel-bin --silent --no-save vercel@latest
    - export PATH="/tmp/vercel-bin/node_modules/.bin:$PATH"
    # The linked Vercel project has rootDirectory=apps/data360 (already committed
    # to apps/data360/.vercel/project.json on the GitLab repo, but .vercel is in
    # .gitignore, so it is NOT in the CI clone). We synthesise it at WORKSPACE
    # ROOT — the directory we run `vercel` from — so the CLI finds the linkage.
    # rootDirectory must be relative to that workspace root.
    - mkdir -p .vercel
    - |
      cat > .vercel/project.json <<EOF
      {
        "projectId": "$VERCEL_PROJECT_ID",
        "orgId": "$VERCEL_ORG_ID",
        "settings": {
          "framework": "nextjs",
          "rootDirectory": "apps/data360"
        }
      }
      EOF
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tee deploy.log
    - tail -n 1 deploy.log > vercel-deploy-url.txt
    - 'echo "Deployed -> $(cat vercel-deploy-url.txt)"'
  artifacts:
    paths: [vercel-deploy-url.txt]
    expire_in: 30 days

# ============================================================================
# EXTRAS (heavy quality lane) — runs only on schedules, on main, or when
# RUN_EXTRAS=1 is set on a manual pipeline. Does not block the fast path.
# ============================================================================

.extras-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$RUN_EXTRAS == "1"'

extras:format-check:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 8 minutes
  script:
    - set +e
    - cd apps/data360
    - npx prettier --check 'src/**/*.{ts,tsx,js,jsx,json,md}' 2>&1 | tee ../../reports/prettier.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/prettier.txt]
    expire_in: 1 week
  allow_failure: true

extras:dep-audit:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 8 minutes
  script:
    - set +e
    - pnpm audit --prod 2>&1 | tee reports/pnpm-audit.txt || true
    - exit 0
  artifacts:
    when: always
    paths: [reports/pnpm-audit.txt]
    expire_in: 1 week
  allow_failure: true

extras:secret-scan:
  stage: extras
  image: debian:bookworm-slim
  rules: !reference [.extras-rules, rules]
  timeout: 5 minutes
  needs: []
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq grep findutils > /dev/null
    - mkdir -p reports
  script:
    - set +e
    - find apps packages -type d \( -name node_modules -o -name .next -o -name .pnpm-store -o -name .turbo -o -name dist -o -name build \) -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.json' \) -print > /tmp/scan-files.txt 2>/dev/null || true
    - xargs -a /tmp/scan-files.txt grep -EHn '(SECRET|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["\x27][^"\x27]{8,}' 2>/dev/null | tee reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'eyJhbGciOi[A-Za-z0-9_-]{20,}' 2>/dev/null | tee -a reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'http://api\.datalab360\.io' 2>/dev/null | tee -a reports/secrets.txt || true
    - LEAKS=$(grep -c . reports/secrets.txt 2>/dev/null || echo 0)
    - 'echo "Potential leaks=$LEAKS"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LEAKS" -gt 0 ]; then exit 1; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/secrets.txt]
    expire_in: 1 month
  allow_failure: true

extras:dead-route-scan:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 5 minutes
  script:
    - set +e
    - node scripts/ci/scan-dead-routes.mjs > reports/dead-routes.txt 2>&1 || true
    - cat reports/dead-routes.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/dead-routes.txt]
    expire_in: 1 week
  allow_failure: true

extras:unit-test:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 10 minutes
  script:
    - set +e
    - if grep -q '"vitest"' apps/data360/package.json; then
        cd apps/data360 && npx vitest run --reporter=verbose 2>&1 | tee ../../reports/vitest.txt;
      else
        echo "No vitest configured - skipping unit tests" | tee reports/vitest.txt;
      fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/vitest.txt]
    expire_in: 1 week
  allow_failure: true

extras:bundle-size:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 6 minutes
  needs:
    - job: build
      artifacts: true
  script:
    - set +e
    - node scripts/ci/bundle-report.mjs apps/data360/.next > reports/bundle.txt 2>&1 || true
    - cat reports/bundle.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/bundle.txt]
    expire_in: 1 week
  allow_failure: true

extras:playwright-smoke:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 12 minutes
  script:
    - set +e
    - npx playwright install --with-deps chromium 2>&1 | tail -3
    - if [ -d "e2e" ]; then
        npx playwright test --project=chromium --reporter=list 2>&1 | tee reports/playwright.txt || true;
      else
        echo "No e2e folder - skipping" | tee reports/playwright.txt;
      fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/playwright.txt, playwright-report/]
    expire_in: 1 week
  allow_failure: true

extras:a11y:
  stage: extras
  extends: .node-readonly
  rules: !reference [.extras-rules, rules]
  timeout: 10 minutes
  needs:
    - job: build
      artifacts: true
  script:
    - set +e
    - pnpm --filter iso start > /tmp/next.log 2>&1 &
    - SERVER_PID=$!
    - sleep 10
    - npx --yes @axe-core/cli http://localhost:3000 --save reports/axe-home.json 2>&1 | tee reports/axe.txt || true
    - npx --yes @axe-core/cli http://localhost:3000/signin --save reports/axe-signin.json 2>&1 | tee -a reports/axe.txt || true
    - kill $SERVER_PID 2>/dev/null || true
    - exit 0
  artifacts:
    when: always
    paths: [reports/axe.txt, reports/axe-home.json, reports/axe-signin.json]
    expire_in: 1 week
  allow_failure: true

extras:summary:
  stage: extras
  image: alpine:3.20
  timeout: 3 minutes
  rules: !reference [.extras-rules, rules]
  before_script:
    - apk add --no-cache bash grep coreutils
    - mkdir -p reports
  needs:
    - job: lint
      optional: true
    - job: typecheck
      optional: true
    - job: extras:format-check
      optional: true
    - job: extras:dep-audit
      optional: true
    - job: extras:secret-scan
      optional: true
    - job: extras:dead-route-scan
      optional: true
    - job: extras:unit-test
      optional: true
    - job: extras:bundle-size
      optional: true
    - job: build
      optional: true
  script:
    - bash scripts/ci/summarize.sh reports/ > reports/summary.md 2>/dev/null || echo "No summary script" > reports/summary.md
    - cat reports/summary.md
  artifacts:
    when: always
    paths: [reports/summary.md, reports/]
    expose_as: "Quality Report"
    expire_in: 1 month

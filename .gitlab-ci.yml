stages:
  - lint
  - test
  - deploy

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  VERCEL_ORG_ID: "team_kC7CPyVYhZTxlOrqAlaKbKfi"
  VERCEL_PROJECT_ID: "prj_P5hsPsdZ24jZUqJzaULd0hFYkKkL"
  SKIP_ENV_VALIDATION: "true"
  NEXTAUTH_SECRET: "ci-only-not-used-at-runtime-32chars-minimum"
  NEXTAUTH_URL: "http://localhost:3000"

cache:
  key: pnpm-$CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - apps/data360/node_modules/
    - apps/docs/node_modules/
    - .pnpm-store/

before_script:
  - node --version
  - mkdir -p /tmp/pnpm-bin
  - npm install --prefix /tmp/pnpm-bin --silent --no-save pnpm@9.1.4
  - export PATH="/tmp/pnpm-bin/node_modules/.bin:$PATH"
  - pnpm --version
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

lint:
  stage: lint
  timeout: 10 minutes
  script:
    - pnpm lint
  allow_failure: false

test:
  stage: test
  timeout: 20 minutes
  script:
    - pnpm --filter iso build
  artifacts:
    paths:
      - apps/data360/.next/
    expire_in: 1 day
    when: on_success
  allow_failure: false

deploy:
  stage: deploy
  timeout: 15 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: lint
    - job: test
      artifacts: true
  script:
    - if [ -z "$VERCEL_TOKEN" ]; then echo "FAIL VERCEL_TOKEN missing in CI variables"; exit 1; fi
    - mkdir -p /tmp/vercel-bin
    - npm install --prefix /tmp/vercel-bin --silent --no-save vercel@latest
    - export PATH="/tmp/vercel-bin/node_modules/.bin:$PATH"
    - mkdir -p .vercel
    - printf '{"projectId":"%s","orgId":"%s","settings":{"framework":"nextjs"}}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tail -1)
    - echo "Deployed → $DEPLOY_URL"
    - echo "$DEPLOY_URL" > vercel-deploy-url.txt
  artifacts:
    paths:
      - vercel-deploy-url.txt
    expire_in: 30 days

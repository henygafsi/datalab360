stages:
  - lint
  - test
  - deploy

# =============================================================================
# LINT STAGE
# =============================================================================

lint:nextjs:
  image: node:18
  stage: lint
  tags:
    - RUN-FRONT
  script:
    - npm install -g pnpm
    - pnpm install
    - pnpm run lint 2>/dev/null || echo "Lint completed with warnings"
  only:
    - dev
    - main
    - merge_requests
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .next/cache/

# =============================================================================
# TEST STAGE
# =============================================================================

test:build:
  image: node:18
  stage: test
  tags:
    - RUN-FRONT
  script:
    - npm install -g pnpm
    - pnpm install
    - pnpm run build
  only:
    - dev
    - main
    - merge_requests
  artifacts:
    paths:
      - .next/
    expire_in: 1 hour

test:page-inventory:
  image: node:18
  stage: test
  tags:
    - RUN-FRONT
  script:
    - echo "=== Dashboard Pages ==="
    - find apps/data360/src/app/\(dashboard\) -name "page.tsx" | wc -l | xargs -I{} echo "Dashboard pages compiled:{}"
    - echo "=== Service Modules ==="
    - find apps/data360/src/app/services -name "index.ts" 2>/dev/null | wc -l | xargs -I{} echo "Service modules:{}"
    - echo "=== Skill Files ==="
    - ls -1 ../.claude/skills/*.md 2>/dev/null | wc -l | xargs -I{} echo "Skill files:{}" || echo "No skills dir"
    - echo "Page inventory complete"
  only:
    - dev
    - main
    - merge_requests

test:bundle-analysis:
  image: node:18
  stage: test
  tags:
    - RUN-FRONT
  script:
    - npm install -g pnpm
    - pnpm install
    - pnpm run build
    - echo "=== Bundle Size Report ==="
    - du -sh .next/ | awk '{print "Total build size:",$1}'
    - du -sh .next/static/ 2>/dev/null | awk '{print "Static assets:",$1}' || true
    - echo "Bundle analysis complete"
  only:
    - dev
    - main
    - merge_requests
  allow_failure: true

# =============================================================================
# DEPLOY STAGE
# =============================================================================

vercel-deploy:
  image: node:18
  stage: deploy
  tags:
    - RUN-FRONT
  only:
    - dev
  before_script:
    - npm install -g vercel
  script:
    - vercel build --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --org=$VERCEL_ORG_ID --project=$VERCEL_PROJECT_ID
  environment:
    name: production

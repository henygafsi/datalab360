# =============================================================================
# Data360 Front — GitLab CI (visibility-first)
#
# Surface every class of issue (type errors, lint, build, a11y, deps, bundle
# bloat, secret leaks, dead routes) without blocking the pipeline on each one.
# Set ENFORCE_QUALITY=1 in CI variables to convert allow_failure jobs to hard.
# =============================================================================

stages:
  - prepare
  - quality
  - test
  - build
  - analyze
  - report
  - deploy

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  VERCEL_ORG_ID: "team_kC7CPyVYhZTxlOrqAlaKbKfi"
  VERCEL_PROJECT_ID: "prj_P5hsPsdZ24jZUqJzaULd0hFYkKkL"
  SKIP_ENV_VALIDATION: "true"
  NEXTAUTH_SECRET: "ci-only-not-used-at-runtime-32chars-minimum"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"
  ENFORCE_QUALITY: "0"

cache:
  key: pnpm-$CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - apps/data360/node_modules/
    - apps/docs/node_modules/
    - .pnpm-store/

.node-setup:
  before_script:
    - node --version
    - mkdir -p /tmp/pnpm-bin reports
    - npm install --prefix /tmp/pnpm-bin --silent --no-save pnpm@9.1.4
    - export PATH="/tmp/pnpm-bin/node_modules/.bin:$PATH"
    - pnpm --version
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# ----------------------------- prepare -----------------------------
install:
  stage: prepare
  extends: .node-setup
  timeout: 20 minutes
  script:
    - pnpm -r --filter './apps/data360' exec node -e "console.log('next:', require('next/package.json').version)"
  artifacts:
    paths: [reports/]
    expire_in: 1 day

# ----------------------------- quality (parallel) -----------------------------
lint:
  stage: quality
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - pnpm lint --format=json --output-file=reports/eslint.json || true
    - pnpm lint 2>&1 | tee reports/eslint.txt
    - LINT_EXIT=${PIPESTATUS[0]}
    - 'echo "Lint exit=$LINT_EXIT"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LINT_EXIT" != "0" ]; then exit $LINT_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/eslint.json, reports/eslint.txt]
    expire_in: 1 week
  allow_failure: true

typecheck:
  stage: quality
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - cd apps/data360
    - npx tsc --noEmit --pretty false --ignoreDeprecations 5.0 2>&1 | tee ../../reports/tsc.txt
    - TSC_EXIT=${PIPESTATUS[0]}
    - ERR=$(grep -cE 'error TS[0-9]+' ../../reports/tsc.txt || echo 0)
    - echo "TSC_ERRORS=$ERR" > ../../reports/tsc.env
    - 'echo "TypeScript errors=$ERR"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$TSC_EXIT" != "0" ]; then exit $TSC_EXIT; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/tsc.txt]
    reports: { dotenv: reports/tsc.env }
    expire_in: 1 week
  allow_failure: true

format-check:
  stage: quality
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - cd apps/data360
    - npx prettier --check 'src/**/*.{ts,tsx,js,jsx,json,md}' 2>&1 | tee ../../reports/prettier.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/prettier.txt]
    expire_in: 1 week
  allow_failure: true

dep-audit:
  stage: quality
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - apk add --no-cache jq 2>/dev/null || true
    - pnpm audit --json > reports/pnpm-audit.json 2>/dev/null || true
    - pnpm audit --prod 2>&1 | tee reports/pnpm-audit.txt || true
    - if command -v jq >/dev/null 2>&1; then
        CRITICAL=$(jq '[.advisories | to_entries[] | select(.value.severity=="critical")] | length' reports/pnpm-audit.json 2>/dev/null || echo 0);
        HIGH=$(jq '[.advisories | to_entries[] | select(.value.severity=="high")] | length' reports/pnpm-audit.json 2>/dev/null || echo 0);
      else CRITICAL=0; HIGH=0; fi
    - echo "DEP_CRITICAL=$CRITICAL" > reports/dep.env
    - echo "DEP_HIGH=$HIGH" >> reports/dep.env
    - 'echo "Critical=$CRITICAL High=$HIGH"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$CRITICAL" -gt 0 ]; then exit 1; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/pnpm-audit.json, reports/pnpm-audit.txt]
    reports: { dotenv: reports/dep.env }
    expire_in: 1 week
  allow_failure: true

secret-scan:
  stage: quality
  image: debian:bookworm-slim
  timeout: 20 minutes
  needs: []
  cache: []  # don't archive node_modules/.pnpm-store for this lightweight job
  before_script:
    - apt-get update -qq && apt-get install -y -qq grep findutils > /dev/null
    - mkdir -p reports
  script:
    - set +e
    - find apps packages -type d \( -name node_modules -o -name .next -o -name .pnpm-store -o -name .turbo -o -name dist -o -name build \) -prune -o -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' -o -name '*.json' \) -print > /tmp/scan-files.txt 2>/dev/null || true
    - xargs -a /tmp/scan-files.txt grep -EHn '(SECRET|PASSWORD|TOKEN|API_KEY|PRIVATE_KEY)[[:space:]]*=[[:space:]]*["\x27][^"\x27]{8,}' 2>/dev/null | tee reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'eyJhbGciOi[A-Za-z0-9_-]{20,}' 2>/dev/null | tee -a reports/secrets.txt || true
    - xargs -a /tmp/scan-files.txt grep -EHn 'http://api\.datalab360\.io' 2>/dev/null | tee -a reports/secrets.txt || true
    - LEAKS=$(grep -c . reports/secrets.txt 2>/dev/null || echo 0)
    - echo "SECRET_LEAKS=$LEAKS" > reports/secret.env
    - 'echo "Potential leaks=$LEAKS"'
    - if [ "$ENFORCE_QUALITY" = "1" ] && [ "$LEAKS" -gt 0 ]; then exit 1; fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/secrets.txt]
    reports: { dotenv: reports/secret.env }
    expire_in: 1 month
  allow_failure: true

dead-route-scan:
  stage: quality
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - node scripts/ci/scan-dead-routes.mjs > reports/dead-routes.txt 2>&1 || true
    - cat reports/dead-routes.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/dead-routes.txt]
    expire_in: 1 week
  allow_failure: true

# ----------------------------- test -----------------------------
unit-test:
  stage: test
  extends: .node-setup
  timeout: 20 minutes
  script:
    - set +e
    - if grep -q '"vitest"' apps/data360/package.json; then
        cd apps/data360 && npx vitest run --reporter=verbose 2>&1 | tee ../../reports/vitest.txt;
      else
        echo "No vitest configured - skipping unit tests" | tee reports/vitest.txt;
      fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/vitest.txt]
    expire_in: 1 week
  allow_failure: true

playwright-smoke:
  stage: test
  extends: .node-setup
  timeout: 15 minutes
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_IID'
      when: manual
      allow_failure: true
  script:
    - set +e
    - npx playwright install --with-deps chromium 2>&1 | tail -3
    - if [ -d "e2e" ]; then
        npx playwright test --project=chromium --reporter=list 2>&1 | tee reports/playwright.txt || true;
      else
        echo "No e2e folder - skipping" | tee reports/playwright.txt;
      fi
    - exit 0
  artifacts:
    when: always
    paths: [reports/playwright.txt, playwright-report/]
    expire_in: 1 week
  allow_failure: true

# ----------------------------- build (must pass — gates deploy) -----------------------------
build:
  stage: build
  extends: .node-setup
  timeout: 20 minutes
  script:
    - pnpm --filter iso build 2>&1 | tee reports/build.txt
  artifacts:
    when: always
    paths: [apps/data360/.next/, reports/build.txt]
    expire_in: 1 day

# ----------------------------- analyze -----------------------------
bundle-size:
  stage: analyze
  extends: .node-setup
  timeout: 10 minutes
  needs: ["build"]
  script:
    - set +e
    - node scripts/ci/bundle-report.mjs apps/data360/.next > reports/bundle.txt 2>&1 || true
    - cat reports/bundle.txt
    - exit 0
  artifacts:
    when: always
    paths: [reports/bundle.txt]
    expire_in: 1 week
  allow_failure: true

a11y:
  stage: analyze
  extends: .node-setup
  timeout: 15 minutes
  needs: ["build"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
  script:
    - set +e
    - pnpm --filter iso start > /tmp/next.log 2>&1 &
    - SERVER_PID=$!
    - sleep 10
    - npx --yes @axe-core/cli http://localhost:3000 --save reports/axe-home.json 2>&1 | tee reports/axe.txt || true
    - npx --yes @axe-core/cli http://localhost:3000/signin --save reports/axe-signin.json 2>&1 | tee -a reports/axe.txt || true
    - kill $SERVER_PID 2>/dev/null || true
    - exit 0
  artifacts:
    when: always
    paths: [reports/axe.txt, reports/axe-home.json, reports/axe-signin.json]
    expire_in: 1 week
  allow_failure: true

# ----------------------------- report -----------------------------
summary:
  stage: report
  timeout: 5 minutes
  before_script:
    - mkdir -p reports
  needs:
    - job: lint
      optional: true
    - job: typecheck
      optional: true
    - job: format-check
      optional: true
    - job: dep-audit
      optional: true
    - job: secret-scan
      optional: true
    - job: dead-route-scan
      optional: true
    - job: unit-test
      optional: true
    - job: bundle-size
      optional: true
    - job: build
      optional: true
  script:
    - bash scripts/ci/summarize.sh reports/ > reports/summary.md
    - cat reports/summary.md
  artifacts:
    when: always
    paths: [reports/summary.md, reports/]
    expose_as: "Quality Report"
    expire_in: 1 month

# ----------------------------- deploy -----------------------------
deploy:
  stage: deploy
  extends: .node-setup
  timeout: 15 minutes
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - job: build
      artifacts: true
  script:
    - if [ -z "$VERCEL_TOKEN" ]; then echo "FAIL VERCEL_TOKEN missing in CI variables"; exit 1; fi
    - mkdir -p /tmp/vercel-bin
    - npm install --prefix /tmp/vercel-bin --silent --no-save vercel@latest
    - export PATH="/tmp/vercel-bin/node_modules/.bin:$PATH"
    - mkdir -p .vercel
    - printf '{"projectId":"%s","orgId":"%s","settings":{"framework":"nextjs"}}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
    - vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
    - vercel build --prod --token="$VERCEL_TOKEN"
    - DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1 | tail -1)
    - echo "Deployed -> $DEPLOY_URL"
    - echo "$DEPLOY_URL" > vercel-deploy-url.txt
  artifacts:
    paths: [vercel-deploy-url.txt]
    expire_in: 30 days

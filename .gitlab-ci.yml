# =============================================================================
# DATA360 PRO — FRONTEND CI/CD (minimal, response-time + cross-role stress)
# 4 stages | 4 stage-3 jobs in parallel | Next.js 14
#
#   lint   → eslint + tsc --noEmit
#   build  → pnpm install + next build
#   test   → next start :3000 + Playwright suites, fanned out across 4
#            parallel jobs (one per spec). Each job runs with 7 workers
#            (= one per persona) so total parallelism is 4 × 7 = 28.
#   deploy → main/dev only — Vercel
# =============================================================================

variables:
  NEXTAUTH_SECRET: "ci-build-secret-placeholder"
  NEXTAUTH_URL: "http://localhost:3000"
  # Enable NextAuth verbose server-side logging in CI so the
  # next-test-consistency.log artifact captures exactly why
  # CredentialsProvider.authorize() fails for the 7 personas. Production
  # build of next.js otherwise logs nothing on auth failures.
  NEXTAUTH_DEBUG: "true"
  NEXT_PUBLIC_API_URL: ${API_BASE_URL:-"http://api.datalab360.io"}
  E2E_BASE_URL: "http://localhost:3000"
  TEST_ACCOUNT: ${SNOWFLAKE_TEST_ACCOUNT:-"abcd"}
  TEST_ADMIN_USER: ${API_TEST_USER:-"TESTADMIN"}
  TEST_ADMIN_PASSWORD: ${API_TEST_PASSWORD:-""}
  TEST_MODELER_USER: ${TEST_MODELER_USER:-"data_modeler_test"}
  TEST_MODELER_PASSWORD: ${TEST_MODELER_PASSWORD:-""}
  TEST_GOVERNOR_USER: ${TEST_GOVERNOR_USER:-"data_governor_test"}
  TEST_GOVERNOR_PASSWORD: ${TEST_GOVERNOR_PASSWORD:-""}
  TEST_ENGINEER_USER: ${TEST_ENGINEER_USER:-"data_engineer_test"}
  TEST_ENGINEER_PASSWORD: ${TEST_ENGINEER_PASSWORD:-""}
  TEST_ANALYST_USER: ${TEST_ANALYST_USER:-"data_viewer_test"}
  TEST_ANALYST_PASSWORD: ${TEST_ANALYST_PASSWORD:-""}
  TEST_AI_USER: ${TEST_AI_USER:-"ai_engineer_test"}
  TEST_AI_PASSWORD: ${TEST_AI_PASSWORD:-""}
  TEST_DQ_USER: ${TEST_DQ_USER:-"dq_analyst_test"}
  TEST_DQ_PASSWORD: ${TEST_DQ_PASSWORD:-""}
  VERCEL_ORG_ID: "team_kC7CPyVYhZTxlOrqAlaKbKfi"
  VERCEL_PROJECT_ID: "prj_P5hsPsdZ24jZUqJzaULd0hFYkKkL"
  # Project-relative cache for Chromium so GitLab cache.paths can pick it
  # up; default ~/.cache/ms-playwright is outside the cache scope.
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/apps/data360/.playwright-cache"
  # Preserve node_modules, .next/cache and the Playwright browser cache
  # across jobs in the same pipeline (cache: section below restores them
  # from the previous pipeline; git clean would otherwise wipe them after
  # restore).
  GIT_CLEAN_FLAGS: "-ffdx -e node_modules/ -e apps/data360/.next/ -e apps/data360/.playwright-cache/"
  # Strict mode — flips kpi-strict-gate to allow_failure=false on main via
  # a rules: clause in the job; flip to '0' to revert to advisory mode.
  # Baseline (pipeline 1448): nav p95 ~4.2s, console errors ~12, 5xx ~1.8%,
  # fail pages 0. KPI thresholds tightened accordingly in kpi-teardown.ts.
  STRICT_KPI_ENFORCE: "1"

stages:
  - lint
  - build
  - test
  - stress
  - deploy

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - rm -rf node_modules/.bin 2>/dev/null; true
    - which pnpm || npm install -g pnpm@9 --silent > /dev/null 2>&1 || true
    - printf "NEXTAUTH_SECRET=%s\nNEXTAUTH_URL=%s\nNEXT_PUBLIC_API_URL=%s\n" "${NEXTAUTH_SECRET}" "${NEXTAUTH_URL}" "${NEXT_PUBLIC_API_URL}" > apps/data360/.env.local

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev)$/'

# Per-branch cache (CI_COMMIT_REF_SLUG); restored at job start, saved at
# job end. Holds pnpm modules, Next.js incremental build cache, and the
# Playwright browser binaries.
cache:
  key: pnpm-${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - apps/data360/node_modules/
    - apps/data360/.next/cache/
    - apps/data360/.playwright-cache/

# =============================================================================
# STAGE 1 — LINT (eslint + typecheck)
# =============================================================================

lint:
  stage: lint
  timeout: 10 minutes
  script:
    - pnpm install --frozen-lockfile --silent > /dev/null 2>&1 || pnpm install
    - echo "── 1/2 eslint ──"
    - pnpm -F data360 lint
    - echo ""
    - echo "── 2/2 tsc --noEmit ──"
    - pnpm -F data360 exec tsc --noEmit

# =============================================================================
# STAGE 2 — BUILD (next build)
# =============================================================================

build:
  stage: build
  timeout: 15 minutes
  script:
    - pnpm install --frozen-lockfile --silent > /dev/null 2>&1 || pnpm install
    - pnpm -F data360 build
  artifacts:
    paths:
      - apps/data360/.next/
    expire_in: 1 day

# =============================================================================
# STAGE 3 — TEST (split into 4 parallel jobs, one per spec)
#
# Each job:
#   1. installs Chromium system deps (sudo apt-get)
#   2. installs the Playwright Chromium binary (cached across pipelines)
#   3. boots `next start` on :3000 and waits for healthcheck
#   4. runs ONE spec with 7 workers (one per persona)
#
# Specs:
#   - page-response-time:  per-persona TTFB / DCL benchmark         (light)
#   - cross-role-stress:   every persona × every page in parallel   (light)
#   - api-endpoint-matrix: every persona × every backend endpoint   (heavy)
#   - page-actions:        per persona, every visible interactive   (heavy)
#
# The two heavy suites also depend on a Snowflake-backed login flow
# which fails on most environments; they only run on main/dev pipelines
# (see rules:). MR pipelines run the two lighter suites only.
#
# Gates: zero 5xx, p95 navigation < 10s, error rate < 5%
# =============================================================================

.test_base:
  stage: test
  timeout: 30 minutes
  # Pipelines 1442/1444 ont rejoué la même contention: 5 jobs test en
  # parallèle sur un runner partagé → page.goto("/signin") timeout 30s.
  # resource_group force GitLab à exécuter les jobs test en série au sein
  # d'un même pipeline (1 Next.js à la fois sur ports différents). Coût
  # wall-clock: ~×5 sur le stage test mais signal réel.
  resource_group: data360_frontend_test_runner
  needs:
    - job: build
      artifacts: true
  # Read-only cache: 4 concurrent test jobs would otherwise race on
  # writing back to the same `pnpm-${CI_COMMIT_REF_SLUG}` cache, leaving
  # one job with a partial node_modules and pnpm reporting "no projects
  # matched the filters". Build job populates the cache; tests pull it.
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/data360/node_modules/
      - apps/data360/.next/cache/
      - apps/data360/.playwright-cache/
    policy: pull
  variables:
    SPEC: ""
  script:
    - pnpm install --frozen-lockfile --silent > /dev/null 2>&1 || pnpm install
    # ── 1/4 Chromium system deps ─────────────────────────────────────────
    # `playwright install --with-deps` calls apt-get internally and needs
    # root which the gitlab-runner user does not have. Install the libs
    # ourselves via sudo (configured in /etc/sudoers.d/gitlab-runner).
    # apt-get update is best-effort — the runner host has stale PPAs (EOL
    # Ubuntu mantic) which return 404; we don't need fresh package lists
    # to install the long-stable Chromium runtime libs.
    - echo "── 1/4 ensure Chromium system deps ──"
    - |
      # Idempotent + concurrency-safe: check dpkg state first; only apt if
      # a package is actually missing. The 4 test jobs all hit this step
      # at the same instant — when libs are already installed (typical
      # past the first pipeline), this is a pure read and there's no lock
      # contention. When something IS missing, flock serialises the apt
      # call so the dpkg-frontend lock isn't fought over.
      NEEDED="libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libnss3
              libnspr4 libxkbcommon0 libpango-1.0-0 libdrm2 libxcomposite1
              libxdamage1 libxext6 libxfixes3 libxrandr2 libgtk-3-0
              libatspi2.0-0 fonts-liberation"
      MISSING=""
      for p in $NEEDED; do
        dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"
      done
      # libasound2 vs libasound2t64: presence depends on Ubuntu version.
      if ! dpkg -s libasound2t64 >/dev/null 2>&1 && ! dpkg -s libasound2 >/dev/null 2>&1; then
        MISSING="$MISSING libasound2t64"  # try noble first; fallback below
      fi
      if [ -z "$MISSING" ]; then
        echo "  all Chromium deps already present — skipping apt"
      else
        echo "  installing:$MISSING"
        # serialise apt across concurrent jobs via flock
        sudo flock --timeout 300 /tmp/d360-apt.lock sudo apt-get install -y --no-install-recommends $MISSING || \
          sudo flock --timeout 300 /tmp/d360-apt.lock sudo apt-get install -y --no-install-recommends \
            $(echo "$MISSING" | sed 's/libasound2t64/libasound2/') || (
              echo "  apt-get failed"; exit 1
          )
        echo "  Chromium deps installed"
      fi
    - echo ""
    # ── 2/4 Playwright browsers (cached at apps/data360/.playwright-cache/) ──
    # Install both `chromium` (full) and `chrome-headless-shell` — recent
    # Playwright versions launch the headless-shell variant by default,
    # `chromium` alone leaves a partial cache and tests die at launch with
    # "Executable doesn't exist at .../chrome-headless-shell-...".
    - echo "── 2/4 install Playwright browsers ──"
    - cd apps/data360 && pnpm exec playwright install chromium chromium-headless-shell > /tmp/pw-install.log 2>&1 || pnpm exec playwright install > /tmp/pw-install.log 2>&1 || (cat /tmp/pw-install.log; exit 1)
    - cd "$CI_PROJECT_DIR"
    - echo "  Chromium + headless-shell installed (PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH})"
    - echo ""
    # ── 3/4 boot next start (per-job port to avoid collision) ────────────
    # 4 test jobs run on the same runner concurrently. Each binds a unique
    # port derived from $CI_JOB_NAME (deterministic, doesn't depend on
    # GitLab's CI_CONCURRENT_* vars which may default to 0 on some runner
    # configs). E2E_BASE_URL flows into Playwright's baseURL via env.
    # `cd apps/data360 && pnpm start` instead of `pnpm -F data360 start`
    # because the workspace filter intermittently fails with "No projects
    # matched" when the cached node_modules is missing the workspace
    # metadata.
    - |
      case "${CI_JOB_NAME}" in
        test-page-response-time)  export NEXT_PORT=3001 ;;
        test-cross-role-stress)   export NEXT_PORT=3002 ;;
        test-api-endpoint-matrix) export NEXT_PORT=3003 ;;
        test-page-actions)        export NEXT_PORT=3004 ;;
        test-consistency)         export NEXT_PORT=3005 ;;
        test-full-routes)         export NEXT_PORT=3008 ;;
        *)                        export NEXT_PORT=3000 ;;
      esac
      export E2E_BASE_URL="http://localhost:${NEXT_PORT}"
      echo "── 3/4 boot next start on :${NEXT_PORT} (job=${CI_JOB_NAME}) ──"
      # Kill any leftover process bound to this port (e.g. an after_script
      # from a previous failed pipeline that didn't reach the kill step).
      # Without this, EADDRINUSE causes the new next.start to crash AND
      # the healthcheck still passes against the OLD Next.js, so the
      # entire test runs against a stale build (pipeline 1427 hit this on
      # port 3005, all personas failed against the stale server). Try
      # multiple discovery tools — lsof / fuser / ss — since the runner
      # image may not ship all three. Wrapped in `|| true` everywhere so a
      # missing tool can never abort the boot step (pipeline 1428 regressed
      # all 5 test jobs because lsof exited non-zero under set -e).
      OLD_PID=""
      if command -v lsof >/dev/null 2>&1; then
        OLD_PID=$(lsof -tiTCP:${NEXT_PORT} -sTCP:LISTEN 2>/dev/null | head -1 || true)
      fi
      if [ -z "$OLD_PID" ] && command -v fuser >/dev/null 2>&1; then
        OLD_PID=$(fuser -n tcp ${NEXT_PORT} 2>/dev/null | tr -d ' ' | head -c 10 || true)
      fi
      if [ -z "$OLD_PID" ] && command -v ss >/dev/null 2>&1; then
        OLD_PID=$(ss -ltnp "sport = :${NEXT_PORT}" 2>/dev/null | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2 || true)
      fi
      if [ -n "$OLD_PID" ]; then
        echo "  killing leftover pid=$OLD_PID on :${NEXT_PORT}"
        kill -9 "$OLD_PID" 2>/dev/null || true
        sleep 1
      else
        echo "  port :${NEXT_PORT} appears free"
      fi
      ( cd apps/data360 && PORT=${NEXT_PORT} pnpm start ) > /tmp/next-${NEXT_PORT}.log 2>&1 &
      NEXT_PID=$!
      echo "  next.start pid=${NEXT_PID} port=${NEXT_PORT}"
      for i in $(seq 1 45); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
          "http://localhost:${NEXT_PORT}/" || echo 000)
        if [ "$CODE" = "200" ] || [ "$CODE" = "307" ] || [ "$CODE" = "302" ]; then
          echo "  / -> ${CODE} (after ${i}s)"; break
        fi
        sleep 1
      done
      if [ "$CODE" != "200" ] && [ "$CODE" != "307" ] && [ "$CODE" != "302" ]; then
        echo "  FAIL: next did not become healthy on :${NEXT_PORT} ($CODE)"
        tail -n 80 /tmp/next-${NEXT_PORT}.log
        kill ${NEXT_PID} 2>/dev/null || true
        exit 1
      fi
      echo "${NEXT_PID}" > /tmp/next-${NEXT_PORT}.pid
      # Persist port + url so the next step (and after_script) sees them.
      echo "NEXT_PORT=${NEXT_PORT}" > /tmp/d360-job-${CI_JOB_ID}.env
    - echo ""
    # ── 4/4 Playwright spec ──────────────────────────────────────────────
    - 'echo "── 4/4 Playwright spec: ${SPEC} (base=${E2E_BASE_URL}) ──"'
    - cd apps/data360 && pnpm exec playwright test "e2e/${SPEC}" --reporter=list
    # Final per-job summary block — surfaces persona auth + spec verdict
    # in the job log so reviewers don't have to dig into the artefact zip.
    - |
      echo ""
      echo "════════════════════════════════════════════════════════════════"
      echo "  FRONTEND E2E — JOB SUMMARY (${CI_JOB_NAME})"
      echo "════════════════════════════════════════════════════════════════"
      RESULTS_DIR="$CI_PROJECT_DIR/apps/data360/playwright-results"
      CG_JSON="$RESULTS_DIR/consistency-gate.json"
      if [ -f "$CG_JSON" ]; then
        echo ""
        echo "▍ Consistency gate"
        node -e "const d=require('$CG_JSON'); console.log('    personas:      '+d.total); console.log('    logged in:     '+d.logged_in); console.log('    score:         '+d.consistency_score_pct+'%'); console.log('    min required:  '+d.min_required); d.results.forEach(r => console.log('    '+(r.loggedIn?'OK ':'KO ')+' '+r.persona.padEnd(9)+(r.loggedIn?'':' — '+(r.reason||'?'))));" 2>/dev/null || cat "$CG_JSON"
      fi
      echo ""
      echo "▍ Spec verdict — base=${E2E_BASE_URL}"
      echo "    artefacts: apps/data360/playwright-report/, apps/data360/playwright-results/"
      echo ""
      echo "OUTCOME: ${CI_JOB_NAME} spec complete — artefacts in apps/data360/playwright-results/"
      echo "════════════════════════════════════════════════════════════════"
  after_script:
    - |
      # kill our own next.start (port-scoped so we don't clobber sibling jobs)
      # AND copy the per-port next log into the artefact dir so the upload
      # actually picks it up (`/tmp/next.log` was outside the project dir
      # and silently dropped by GitLab's artefact uploader).
      if [ -f /tmp/d360-job-${CI_JOB_ID}.env ]; then
        . /tmp/d360-job-${CI_JOB_ID}.env
        if [ -f /tmp/next-${NEXT_PORT}.log ]; then
          mkdir -p apps/data360/playwright-results
          cp /tmp/next-${NEXT_PORT}.log "apps/data360/playwright-results/next-${CI_JOB_NAME}.log" || true
        fi
        if [ -f /tmp/next-${NEXT_PORT}.pid ]; then
          kill $(cat /tmp/next-${NEXT_PORT}.pid) 2>/dev/null || true
        fi
      fi
  artifacts:
    when: always
    paths:
      - apps/data360/playwright-report/
      - apps/data360/playwright-results/
    expire_in: 7 days

# Light specs — run on every pipeline (MR + main/dev).
# Job names use hyphens (no colons): GitLab CI parses `test:foo:bar` as a
# 3-level YAML key path on some runner versions and rejects it with
# "script config should be a string or a nested array …".
test-page-response-time:
  extends: .test_base
  variables:
    SPEC: "page-response-time.spec.ts"

test-cross-role-stress:
  extends: .test_base
  variables:
    SPEC: "cross-role-stress.spec.ts"

# Heavy specs — only on main/dev (Snowflake auth + 768-endpoint matrix).
test-api-endpoint-matrix:
  extends: .test_base
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev)$/'
  variables:
    SPEC: "api-endpoint-matrix.spec.ts"

test-page-actions:
  extends: .test_base
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev)$/'
  variables:
    SPEC: "page-actions.spec.ts"

# CI consistency gate — single source of truth for "did the suite actually
# verify anything". Hard-fails when fewer than E2E_MIN_LOGINS personas
# authenticate (default 3 of 7), even though the per-persona suites would
# all pass green via test.skip(). Deploy depends on this job, so a green
# pipeline here means real coverage.
test-consistency:
  extends: .test_base
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev)$/'
  variables:
    SPEC: "_consistency-gate.spec.ts"

# Optional full-route sweep — runs cross-role-stress with STRESS_FULL_ROUTES=1
# so every persona walks every FS-derived static page (94 routes).
#
# Pipeline 1439: when this job ran in parallel with the other 5 test jobs on
# the same shared runner, all 6 Next.js processes contended for CPU and
# `page.goto("/signin")` timed out at 30s in cross-role-stress AND
# page-response-time. Gating it on the pipeline variable RUN_FULL_ROUTES=1
# (manual trigger or schedule) keeps the default pipeline cost unchanged.
test-full-routes:
  extends: .test_base
  rules:
    - if: '$RUN_FULL_ROUTES == "1"'
  allow_failure: true
  variables:
    SPEC: "cross-role-stress.spec.ts"
    STRESS_FULL_ROUTES: "1"

# =============================================================================
# STAGE 4 — STRESS (main/dev only — perf + scalability signal, allow_failure)
#
# Trois jobs lancés en parallèle aussitôt que `build` est fini (needs:[build])
# donc ils tournent en même temps que les 5 jobs `test:*`. Tous trois
# `allow_failure: true` pendant la phase de baseline : on collecte du signal
# avant de durcir les seuils.
#
#   - stress-k6-api            : k6 en charge HTTP, 7 VUs × 60 s, p95 < 5 s
#   - stress-playwright-conc.  : N navigateurs Chromium en parallèle, TTFB/DCL/load
#   - stress-lighthouse        : LHCI cold-start, LCP/CLS/TBT budgets
#   - stress-summary           : agrège les 3 sorties pour le log reviewer
#
# Versions épinglées : k6 v0.49.0, @lhci/cli@0.14.0
# =============================================================================

.stress_base:
  stage: stress
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev)$/'
  # Pipeline 1442 régression: les 6 stress jobs en parallèle des 5 test jobs
  # ont créé une contention CPU/RAM sur le runner partagé → page.goto("/signin")
  # timeout à 30s dans test-page-response-time (2 failed + 5 flaky). On force
  # les stress jobs à attendre que le stage test finisse pour libérer le runner.
  needs:
    - job: build
      artifacts: true
    - job: test-page-response-time
      artifacts: false
      optional: true
    - job: test-cross-role-stress
      artifacts: false
      optional: true
  cache:
    key: pnpm-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - apps/data360/node_modules/
      - apps/data360/.next/cache/
      - apps/data360/.playwright-cache/
    policy: pull
  allow_failure: true
  timeout: 30 minutes

# --- 4.1 k6 ----------------------------------------------------------------
# Charge HTTP concurrente : 7 VUs (un par persona) qui s'authentifient via
# le flow NextAuth puis bouclent 5 GETs de leur RBAC pendant 60 s.
stress-k6-api:
  extends: .stress_base
  variables:
    NEXT_PORT: "3006"
    K6_VERSION: "v0.49.0"
  script:
    - pnpm install --frozen-lockfile --silent > /dev/null 2>&1 || pnpm install
    - echo "── 1/3 install k6 ${K6_VERSION} ──"
    - |
      if ! command -v k6 >/dev/null 2>&1; then
        K6_DIR="${CI_PROJECT_DIR}/.k6-bin"
        mkdir -p "$K6_DIR"
        ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64;; aarch64) ARCH=arm64;; esac
        TARBALL="k6-${K6_VERSION}-linux-${ARCH}.tar.gz"
        URL="https://github.com/grafana/k6/releases/download/${K6_VERSION}/${TARBALL}"
        echo "  fetching ${URL}"
        curl -sSL "$URL" -o "$K6_DIR/${TARBALL}"
        tar -xzf "$K6_DIR/${TARBALL}" -C "$K6_DIR" --strip-components=1
        export PATH="$K6_DIR:$PATH"
      fi
      k6 version
    - echo ""
    - echo "── 2/3 boot next start on :${NEXT_PORT} ──"
    - |
      export E2E_BASE_URL="http://localhost:${NEXT_PORT}"
      ( cd apps/data360 && PORT=${NEXT_PORT} pnpm start ) > /tmp/next-${NEXT_PORT}.log 2>&1 &
      NEXT_PID=$!
      for i in $(seq 1 45); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://localhost:${NEXT_PORT}/" || echo 000)
        if [ "$CODE" = "200" ] || [ "$CODE" = "307" ] || [ "$CODE" = "302" ]; then
          echo "  / -> ${CODE} (after ${i}s)"; break
        fi
        sleep 1
      done
      echo "${NEXT_PID}" > /tmp/next-${NEXT_PORT}.pid
    - echo ""
    - echo "── 3/3 k6 run ──"
    - |
      cd apps/data360
      mkdir -p stress
      STRESS_BASE_URL="http://localhost:${NEXT_PORT}" \
      STRESS_DURATION="${STRESS_DURATION:-60s}" \
        k6 run \
          --out json=stress/k6-results.json \
          --summary-export=stress/k6-summary.json \
          stress/k6-api-load.js || echo "k6 thresholds breached (allow_failure)"
  after_script:
    - |
      [ -f /tmp/next-3006.pid ] && kill $(cat /tmp/next-3006.pid) 2>/dev/null || true
      [ -f /tmp/next-3006.log ] && cp /tmp/next-3006.log apps/data360/stress/next-stress-k6.log || true
  artifacts:
    when: always
    paths:
      - apps/data360/stress/
    expire_in: 14 days

# --- 4.2 Playwright concurrent --------------------------------------------
# Spawn N=14 contextes Chromium en parallèle, chaque contexte navigue ses
# pages persona en ordre aléatoire pendant 90 s. Mesure TTFB/DCL/load.
stress-playwright-concurrent:
  extends: .stress_base
  variables:
    NEXT_PORT: "3006"
    STRESS_CONTEXTS: "14"
    STRESS_DURATION_S: "90"
  script:
    - pnpm install --frozen-lockfile --silent > /dev/null 2>&1 || pnpm install
    # Chromium deps + navigateurs (idempotent — voir .test_base pour le détail)
    - echo "── 1/3 ensure Chromium deps ──"
    - |
      NEEDED="libatk1.0-0 libatk-bridge2.0-0 libcups2 libgbm1 libnss3 libnspr4
              libxkbcommon0 libpango-1.0-0 libdrm2 libxcomposite1 libxdamage1
              libxext6 libxfixes3 libxrandr2 libgtk-3-0 libatspi2.0-0 fonts-liberation"
      MISSING=""
      for p in $NEEDED; do dpkg -s "$p" >/dev/null 2>&1 || MISSING="$MISSING $p"; done
      if ! dpkg -s libasound2t64 >/dev/null 2>&1 && ! dpkg -s libasound2 >/dev/null 2>&1; then
        MISSING="$MISSING libasound2t64"
      fi

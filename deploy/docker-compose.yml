# Local prod-parity stack: backend + frontend + redis. Secrets via env_file (gitignored).
#   docker compose -f deploy/docker-compose.yml up --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server","--maxmemory","512mb","--maxmemory-policy","allkeys-lru"]
    healthcheck: { test: ["CMD","redis-cli","ping"], interval: 10s, retries: 5 }

  api:
    build: { context: ../backend, dockerfile: ../datalab360Front/deploy/backend.Dockerfile }
    env_file: [../backend/app/.env]     # runtime-only; NEVER baked into the image
    environment:
      REDIS_URL: redis://redis:6379
      WEB_CONCURRENCY: "2"
    depends_on: { redis: { condition: service_healthy } }
    ports: ["8000:8000"]
    healthcheck: { test: ["CMD-SHELL","python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""], interval: 30s, retries: 3, start_period: 20s }

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
    environment: { API_PROXY_UPSTREAM: "http://api:8000" }
    depends_on: { api: { condition: service_healthy } }
    ports: ["3000:3000"]

  # one-shot preventive gate: probes the running api, exits non-zero on 5xx/404
  healthgate:
    image: node:20-slim
    profiles: [verify]
    volumes: ["./deploy/scripts:/scripts:ro"]
    environment: { BASE: "http://api:8000", FAIL_ON: "5xx,unreachable" }
    depends_on: { api: { condition: service_healthy } }
    command: ["node","/scripts/endpoint-health.mjs"]
